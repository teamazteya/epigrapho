# Builds the Epigrapho phone app (M1): an Android APK and App Bundle, and an
# iOS build for the simulator.
#
# The scripture and original-language packs, and the editor page that reads
# them, ship inside the app package, so they are built first, as the desktop
# workflow does for its web build.
#
# Android is signed with the upload key from the repository secrets
# (ANDROID_KEYSTORE_*), and with the debug key when they are missing. iOS is
# built for the simulator, unsigned, until the App Store Connect key is in
# the secrets (M1 Fase 6.2).
#
# ponytail: during M1 it runs on pushes to the m1-ios work branch; Fase 7
# moves it to the v* tags that publish the desktop release.
name: Epigrapho mobile

on:
  workflow_dispatch:
  push:
    branches:
      - m1-ios

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Android
          - os: macos-15
            name: iOS

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      # The packs are read from beside the editor page, inside the app. The
      # task runner builds every package the app depends on, the editor page
      # and original-languages among them; bible-pack is not one of them, so
      # it goes first and writes its pack into the editor page's public/.
      - name: Build the packs and the editor page
        run: |
          (cd packages/bible-pack && npm run build)
          npm run tx mobile:build

      - name: Put the upload key in place
        if: runner.os == 'Linux'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64: the build is signed with the debug key."
          fi

      # GitHub's APK checks for updates itself (GITHUB_RELEASE); Play's does
      # not, the store does it. arm64-v8a covers the phones of the last years.
      - name: Build the APK and the App Bundle
        if: runner.os == 'Linux'
        working-directory: ./apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ENVFILE=.env.public ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../dist/epigrapho_android.apk
          ENVFILE=.env ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../dist/epigrapho_android.aab

      - name: Build for the iOS simulator
        if: runner.os == 'macOS'
        working-directory: ./apps/mobile/ios
        # bash, not the default shell: with pipefail, xcodebuild's failure is
        # not hidden by the tail that keeps the log readable.
        shell: bash
        run: |
          pod install
          xcodebuild \
            -workspace Notesnook.xcworkspace \
            -scheme Notesnook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -xcconfig build-configs/ios-build.active.xcconfig \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 200
          mkdir -p ../dist
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/*.app ../dist/epigrapho_ios_simulator.zip

      # ponytail: a smoke test, the app opens and is still running after 30
      # seconds, with a screenshot to look at. The full walk is the Android
      # oracle (m1-device-check.mjs); a Detox run here once iOS diverges.
      - name: Open the app in the simulator
        if: runner.os == 'macOS'
        working-directory: ./apps/mobile/ios
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const all=Object.values(JSON.parse(s).devices).flat();console.log(all.find(d=>/^iPhone/.test(d.name)).udid)})")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
          xcrun simctl install "$device" build/Build/Products/Release-iphonesimulator/*.app
          xcrun simctl launch "$device" tech.azteya.epigrapho
          sleep 30
          xcrun simctl io "$device" screenshot ../dist/epigrapho_ios_simulator.png
          if ! xcrun simctl spawn "$device" launchctl list | grep -q tech.azteya.epigrapho; then
            # Why it closed, next to the screenshot.
            cp ~/Library/Logs/DiagnosticReports/*.ips ../dist/ 2>/dev/null || true
            xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process == "Notesnook"' > ../dist/epigrapho_ios_log.txt || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        # Also when the app did not stay open: the screenshot and the crash
        # report say why.
        if: always()
        with:
          name: epigrapho-${{ matrix.name }}
          path: apps/mobile/dist/*
          if-no-files-found: error
