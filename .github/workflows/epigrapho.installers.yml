# Builds the Epigrapho desktop installers for Windows, macOS and Linux
# (AppImage, deb for Debian and Ubuntu, rpm for Fedora, pacman for Arch).
#
# macOS is the reason this exists: a .dmg can only be produced on macOS, and
# GitHub's macOS runners are the way to get one without owning a Mac.
#
# Nothing here is signed. Windows will show SmartScreen and macOS will refuse
# to open the app until the person right-clicks and chooses Open, because
# Epigrapho has no code-signing certificate and no Apple Developer account
# yet. The installers work; they just arrive unvouched-for.
#
# A tag vX.Y.Z also publishes them as a GitHub release, which is where the
# app looks for updates (electron-updater reads the latest*.yml files next
# to the installers). The tag's own message becomes the release notes the
# app shows, so write it for the people who use Epigrapho:
#   git tag -a v1.0.1 -m "Epigrapho 1.0.1" -m "- Qué cambió…" && git push epigrapho v1.0.1
# Run by hand, the workflow only builds and keeps the installers as files.
name: Epigrapho installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifacts: |
              apps/desktop/output/*.exe
              apps/desktop/output/*.blockmap
              apps/desktop/output/latest*.yml
          - os: macos-14
            name: macOS
            artifacts: |
              apps/desktop/output/*.dmg
              apps/desktop/output/*.zip
              apps/desktop/output/*.blockmap
              apps/desktop/output/latest*.yml
          - os: ubuntu-24.04
            name: Linux
            artifacts: |
              apps/desktop/output/*.AppImage
              apps/desktop/output/*.deb
              apps/desktop/output/*.rpm
              apps/desktop/output/*.pacman
              apps/desktop/output/*.blockmap
              apps/desktop/output/latest*.yml

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      # rpmbuild makes the .rpm and bsdtar the Arch package.
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      # --ignore-scripts keeps the native modules from being built twice: the
      # desktop build rebuilds them for Electron's own ABI further down.
      - name: Install packages
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=web
          npm run bootstrap -- --scope=desktop

      # The runner is Apple Silicon, so npm only installs the arm64 SQLite
      # extensions; the Intel build would ship without them and search would
      # not work there. Their x64 builds are fetched at the locked versions.
      - name: Add the Intel SQLite extensions
        if: runner.os == 'macOS'
        working-directory: ./apps/desktop
        run: |
          for name in sqlite-better-trigram-darwin-x64 sqlite3-fts5-html-darwin-x64; do
            version=$(node -p "require('./package-lock.json').packages['node_modules/$name'].version")
            mkdir -p "node_modules/$name"
            curl -sfL "$(npm view "$name@$version" dist.tarball)" | tar xz --strip-components=1 -C "node_modules/$name"
            ls "node_modules/$name"
          done

      # The tag is the version: the app compares it with the release it finds
      # to know whether there is an update.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for app in apps/desktop apps/web; do
            (cd "$app" && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts)
          done

      - name: Build the app
        working-directory: ./apps/desktop
        run: node scripts/build.mjs

      # LanguageTool and one Java runtime per architecture this runner
      # packages (ADR-0010). The script downloads its own JDK and Maven.
      - name: Build the grammar checker
        working-directory: ./apps/desktop
        run: node scripts/build-languagetool.mjs

      - name: Build the native modules for Electron
        working-directory: ./apps/desktop
        run: npm exec --no -- electron-builder install-app-deps

      - name: Package the installer
        working-directory: ./apps/desktop
        run: npx electron-builder --config=electron-builder.config.js --publish=never

      # Installed apps look for updates where app-update.yml says. Upstream's
      # pointed at Notesnook's releases; fail here if one ever ships again.
      - name: Check the update feed
        shell: bash
        working-directory: ./apps/desktop/output
        run: |
          found=0
          while IFS= read -r feed; do
            echo "$feed:"; cat "$feed"; echo
            grep -q "owner: teamazteya" "$feed" && grep -q "repo: epigrapho" "$feed"
            found=1
          done < <(find . -name app-update.yml -path "*esources*")
          test "$found" = 1

      # An unsigned Apple Silicon app is reported as "damaged" once it has
      # been downloaded; fail here instead of shipping one.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        working-directory: ./apps/desktop/output
        run: |
          for app in mac-arm64/Epigrapho.app mac/Epigrapho.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Signature)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: epigrapho-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Once every system has built, a tag becomes a release with all the
  # installers and update files, which the installed apps then find.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Epigrapho ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
