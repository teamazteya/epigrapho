# Builds the Epigrapho desktop installers for Windows, macOS and Linux
# (AppImage, deb for Debian and Ubuntu, rpm for Fedora, pacman for Arch).
#
# macOS is the reason this exists: a .dmg can only be produced on macOS, and
# GitHub's macOS runners are the way to get one without owning a Mac.
#
# Nothing here is signed. Windows will show SmartScreen and macOS will refuse
# to open the app until the person right-clicks and chooses Open, because
# Epigrapho has no code-signing certificate and no Apple Developer account
# yet. The installers work; they just arrive unvouched-for.
name: Epigrapho installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifacts: |
              apps/desktop/output/*.exe
              apps/desktop/output/*.blockmap
          - os: macos-14
            name: macOS
            artifacts: |
              apps/desktop/output/*.dmg
              apps/desktop/output/*.zip
          - os: ubuntu-24.04
            name: Linux
            artifacts: |
              apps/desktop/output/*.AppImage
              apps/desktop/output/*.deb
              apps/desktop/output/*.rpm
              apps/desktop/output/*.pacman

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      # --ignore-scripts keeps the native modules from being built twice: the
      # desktop build rebuilds them for Electron's own ABI further down.
      # rpmbuild makes the .rpm and bsdtar the Arch package.
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Install packages
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=web
          npm run bootstrap -- --scope=desktop

      - name: Build the app
        working-directory: ./apps/desktop
        run: node scripts/build.mjs

      - name: Build the native modules for Electron
        working-directory: ./apps/desktop
        run: npm exec --no -- electron-builder install-app-deps

      - name: Package the installer
        working-directory: ./apps/desktop
        run: npx electron-builder --config=electron-builder.config.js --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: epigrapho-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
