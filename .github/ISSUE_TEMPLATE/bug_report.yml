name: Reportar un error
description: ¿Algo falla o la app se cierra en Epigrapho?
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportarlo. No incluyas el contenido privado de tus notas.
  - type: textarea
    id: what-happened
    attributes:
      label: ¿Qué pasó?
      description: Cuéntanos qué intentabas hacer y qué pasó en su lugar.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Pasos para reproducirlo
      description: Si podemos reproducirlo, podemos corregirlo.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: ¿Qué versión de Epigrapho usas? Está en Ajustes > Acerca de.
      placeholder: 3.4.8
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Sistema
      description: ¿En qué sistema ves el problema?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux (Debian / Ubuntu)
        - Linux (Fedora)
        - Linux (Arch / CachyOS)
        - Linux (AppImage)
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros
      description: Si tienes registros o mensajes de error, pégalos aquí. Se formatean como código, no hace falta agregar comillas invertidas.
      render: shell
