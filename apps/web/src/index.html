<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    <!--
      Notice the use of  in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <meta name="description" content="Your private note taking space" />
    <meta property="og:title" content="Epigrapho" />
    <meta
      property="og:description"
      content="A fully open source & end-to-end encrypted note taking alternative to Evernote."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Epigrapho" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Epigrapho</title>

    <style id="theme-colors"></style>
    <script>
      (async function validateServiceWorkerTrack() {
        const cookie = document.cookie.match(/release\-track=([^;]+)/);
        const releaseTrack = cookie ? cookie[1] : "stable";
        const expectedPrefix =
          releaseTrack === "beta" ? "notesnook-beta" : "notesnook";

        const cacheKeys = await caches.keys();
        const mismatched = cacheKeys.some(
          (key) => !key.startsWith(expectedPrefix)
        );

        if (mismatched) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          await Promise.all(cacheKeys.map((key) => caches.delete(key)));
          window.location.reload();
        }
      })();
    </script>
    <script type="module" src="./index.ts"></script>
    <style>
      html {
        overscroll-behavior: none;
      }

      html[data-theme="light"] .react-loading-skeleton {
        --base-color: var(--background-secondary);
        --highlight-color: #var(--background-secondary);
      }

      html[data-theme="dark"] .react-loading-skeleton {
        --base-color: var(--background-secondary);
        --highlight-color: var(--background-secondary);
      }

      #splash {
        background-color: var(--background);
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #splash svg {
        transform: scale(1);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.9);
        }

        70% {
          transform: scale(1);
        }

        100% {
          transform: scale(0.9);
        }
      }

      html,
      body {
        font-size: 16px;
      }

      @media only screen and (max-width: 480px) {
        html,
        body {
          font-size: 18px;
          background-color: var(--background);
        }
      }

      :root,
      body,
      #root {
        margin: 0 !important;
        height: 100%;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      /* svg {
  width: 1.5rem;
} */
      .ReactModal__Overlay {
        opacity: 0;
        transition: opacity 200ms ease-in-out;
      }

      .ReactModal__Overlay--after-open {
        opacity: 1;
      }

      .ReactModal__Overlay--before-close {
        opacity: 0;
      }

      .slide {
        background-color: transparent !important;
      }

      .carousel.carousel-slider {
        display: flex;
        flex-direction: row;
      }
    </style>
  </head>

  <body class="theme-scope-base">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--     <script src="https://cdn.jsdelivr.net/npm/highlightjs@9.16.2/highlight.pack.min.js"></script>
 -->
    <div id="root"></div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="height: 0; width: 0; z-index: -1; position: absolute"
    >
      <!-- Epigrapho: the mark is a raster, so both symbols point at the same
           file instead of carrying a path. `full-logo` is the tile as it is;
           `themed-logo` was a one-colour version that followed the theme, and
           a coloured mark cannot do that, so it is now the same tile. -->
      <symbol id="full-logo" viewBox="0 0 512 512">
        <image width="512" height="512" href="/favicon.png" />
      </symbol>
      <symbol id="themed-logo" viewBox="0 0 512 512">
        <image width="512" height="512" href="/favicon.png" />
      </symbol>
    </svg>
    <div id="splash" class="hidden">
      <svg style="height: 120px; width: 120px">
        <use href="#themed-logo" />
      </svg>
      <span
        style="
          margin-top: 10px;
          font-family: Hack, Consolas, 'Andale Mono', 'Lucida Console',
            'Liberation Mono', 'Courier New', Courier, monospace;
          color: var(--paragraph);
          font-size: 0.8rem;
        "
      >
        Starting up the engines
      </span>
    </div>
    <div id="dialogContainer"></div>
    <div id="floatingViewContainer"></div>

  </body>
</html>
